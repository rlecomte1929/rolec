# W3-4 (report-only): generate LIVE RAG-eval reports so the admin dashboard
# (GET /api/admin/rag-eval/metrics) shows real data instead of the deterministic
# mock fallback.
#
# This is intentionally NOT a PR CI gate: the evaluators are wired to the live
# immigration corpus (immigration_retriever → pgvector + OpenAI embeddings), so a
# PR runner with no corpus/key would only ever produce 0.0 noise. This job runs
# against real infra (the same DATABASE_URL + OPENAI_API_KEY secrets the
# immigration-indexer uses), writes context_precision_<date>.json and
# factual_consistency_<date>.json into audit/rag_eval/, and commits them back so
# they deploy with the backend and the dashboard reads them as `source: "live"`.
#
# Numbers reflect current corpus coverage (only some corridors are indexed today),
# which is the honest signal the mock was hiding. Run on demand; a weekly schedule
# can be enabled once coverage is broad.
name: RAG eval reports (live)

on:
  workflow_dispatch:
    inputs:
      hybrid:
        description: "Run with IMMIGRATION_HYBRID_RETRIEVAL=on (exercises the Postgres FTS path; writes *_hybrid.json so it does not overwrite the vector run)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  rag-eval-reports:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Guard required secrets
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_URL secret is not set — needed to read the immigration corpus."
            exit 1
          fi
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::error::OPENAI_API_KEY secret is not set — embeddings would fall back to hash vectors that mismatch the retriever."
            exit 1
          fi

      - name: Generate eval reports (report-only — no --ci gate)
        env:
          # Quoted env (not inlined into run:) per workflow-injection guidance.
          HYBRID: ${{ github.event.inputs.hybrid }}
        run: |
          set -euo pipefail
          DATE="$(date +%Y%m%d)"
          SUFFIX=""
          if [ "${HYBRID:-false}" = "true" ]; then
            export IMMIGRATION_HYBRID_RETRIEVAL=on
            SUFFIX="_hybrid"
            echo "Running eval with IMMIGRATION_HYBRID_RETRIEVAL=on (Postgres FTS path)."
          fi
          mkdir -p audit/rag_eval
          python backend/scripts/eval_rag_context_precision.py \
            --out "audit/rag_eval/context_precision_${DATE}${SUFFIX}.json"
          python backend/scripts/eval_factual_consistency.py \
            --out "audit/rag_eval/factual_consistency_${DATE}${SUFFIX}.json"

      - name: Commit reports if changed
        run: |
          if [ -z "$(git status --porcelain audit/rag_eval)" ]; then
            echo "No new/changed eval reports — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audit/rag_eval/*.json
          git commit -m "chore(rag-eval): refresh live eval reports [skip ci]"
          git push
