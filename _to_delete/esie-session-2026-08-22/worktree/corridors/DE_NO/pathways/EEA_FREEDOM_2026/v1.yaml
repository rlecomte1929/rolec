# Corridor Agent — DE_NO_2026  (Germany → Norway, free movement)
#
# REPRESENTATIVE — indicative content, NOT SME-verified. Grounded in the
# EEA free movement (EEA Agreement Art. 28; Utlendingsloven ch. 13) framework. An EU/EEA/EFTA national needs NO visa and NO salary floor;
# the journey is the administrative registration sequence. Confirm details with
# the destination authority before any authoritative use.

corridor_agent:
  corridor_id: DE_NO_2026
  version: "2026.01"
  petitioning_party: EMPLOYEE
  origin_country_iso3: DEU
  destination_country_iso3: NOR
  description: >
    Germany (EU/EEA/EFTA) national → Norway under free movement.
    No visa or residence-permit gate; the pathway models the administrative
    registration sequence.

  applicable_rules:
    - legal_reference: "EEA Agreement Art. 28"
      rule_id: EEA_ART_28
      summary: "Free movement of workers within the EEA."
    - legal_reference: "Utlendingsloven §110"
      rule_id: NO_UTL_110
      summary: "Right of residence beyond three months for EEA workers; registration duty."
    - legal_reference: "Utlendingsloven §117"
      rule_id: NO_UTL_117
      summary: "EEA registration certificate issued by the police."
    - legal_reference: "Folkeregisterloven §4-1"
      rule_id: NO_FOLKEREG_4_1
      summary: "Registration in the National Population Register (D-number / personnummer)."

  required_documents:
    - PASSPORT_OR_NATIONAL_ID:employee
    - PASSPORT_OR_NATIONAL_ID:family.spouse?
    - EMPLOYMENT_CONTRACT?

  required_data_points:
    - key: eu_eea_nationality
      type: bool
      source: USER_INPUT
      validations:
        - "== true"

  # No salary floor applies to free movement.
  salary_thresholds_eur: {}

  eligibility_logic:
    branches:
      - id: BRANCH_FREE_MOVEMENT
        label: "EEA freedom of movement (EEA Agreement Art. 28)"
        cite: EEA_ART_28
        requires_all:
          - eu_eea_nationality == true
        verdict_on_pass: ELIGIBLE
    no_branch_verdict: NOT_ELIGIBLE

  exception_cases: []

  step_graph:
    - step_id: TRAVEL_TO_NO
      name: "Travel to Norway (no visa required for EEA nationals)"
      # Free movement: the graph roots at arrival, so pre-arrival runway is ~0.
      arrival_anchor: true
      responsible_party: EMPLOYEE
      expected_duration_days: 1
      prerequisite_step_ids: []

    - step_id: EEA_POLICE_REGISTRATION
      name: "EEA registration with the police (registreringsbevis)"
      responsible_party: EMPLOYEE
      expected_duration_days: 14
      prerequisite_step_ids: [TRAVEL_TO_NO]
      cite: NO_UTL_110

    - step_id: NATIONAL_REGISTRY
      name: "Register with the tax office — D-number / personnummer (Folkeregister)"
      responsible_party: EMPLOYEE
      expected_duration_days: 21
      prerequisite_step_ids: [EEA_POLICE_REGISTRATION]
      cite: NO_FOLKEREG_4_1

    - step_id: HEALTH_REGISTRATION
      name: "Public health registration (HELFO / fastlege)"
      responsible_party: EMPLOYEE
      expected_duration_days: 14
      prerequisite_step_ids: [NATIONAL_REGISTRY]

    - step_id: BANK_ACCOUNT
      name: "Norwegian bank account opened (requires D-number/personnummer)"
      responsible_party: EMPLOYEE
      expected_duration_days: 10
      prerequisite_step_ids: [NATIONAL_REGISTRY]
