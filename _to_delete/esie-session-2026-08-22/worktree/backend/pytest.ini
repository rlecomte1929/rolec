[pytest]
testpaths = tests
pythonpath = .
# QG-2: async tests (e.g. test_llm_client.py) auto-run without per-test markers.
asyncio_mode = auto
markers =
    policy_assistant_audit: Opt-in tests for the policy assistant audit harness (run with -m policy_assistant_audit).
    integration: Live integration tests that need external services (DB / Supabase); skip without env.
    postgres: [AIQ-1852] Needs a real Postgres DATABASE_URL and nothing else. Run by the
        `backend-tests-postgres` CI job against a postgres:16 service; EXCLUDED from the sqlite
        lane, which cannot satisfy them. Distinct from `integration`, which also needs Supabase
        credentials and so cannot run on a bare service container.
