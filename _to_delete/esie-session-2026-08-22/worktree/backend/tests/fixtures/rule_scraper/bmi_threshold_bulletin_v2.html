<body>
  <article>
    <h1>Bundesgesetzblatt 2026 - Anpassung der Gehaltsschwellen</h1>
    <p>
      Die allgemeine Mindestgehaltsschwelle fuer die Blaue Karte EU nach
      § 18g AufenthG betraegt ab 1. Januar 2026 48 300 Euro brutto im Jahr.
      Die abgesenkte Schwelle fuer Engpass- und Berufsanfaengerfaelle liegt bei
      43 759,80 Euro.
    </p>
