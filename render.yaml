# render.yaml — Render Blueprint (Infrastructure as Code)
#
# WHY THIS EXISTS
# ---------------
# The frontend security headers (SEC-005) were authored as a Netlify/Cloudflare-Pages
# style `frontend/public/_headers` file. Render Static Sites do NOT honor that file —
# they serve it as a static asset. Verified on prod: GET https://relopass.com/_headers
# returns the file (HTTP 200) and NONE of the CSP / HSTS / X-Frame-Options / Referrer-
# Policy / Permissions-Policy headers are present on responses. (Render DOES honor
# `_redirects`, which is why SPA routing works but the headers never applied.)
#
# This Blueprint moves those headers to a mechanism Render actually enforces: the
# static site `headers` field. The CSP value matches the (now self-hosted, Google-Fonts-
# free) policy on `main`.
#
# !! THIS FILE IS LIVE — IT GOVERNS PRODUCTION FRONTEND ROUTING !!
# (It was inert when first written. The Blueprint was adopted and verified in #518,
# 45f6feb9 — "deep paths now 200 natively; all 6 headers served from render.yaml" —
# and `frontend/public/_redirects` was deleted in the same commit because Render
# ignores it once Blueprint/dashboard rules exist. The old "inert" warning survived
# here for months and is why the ADS-3 shell defect was mis-diagnosed as a missing
# `_redirects` file. Corrected 2026-08-10.)
#
# Practical consequences:
#   - `routes:` below is the ONLY place the SPA fallback and any per-path rewrite can
#     be changed. Adding `frontend/public/_redirects` will do nothing.
#   - Changes here take effect on the next Blueprint sync, not on plain `git push`.
#     Confirm in the Render dashboard that the sync ran before trusting a routing fix.
#
# CAUTION on Blueprint adoption: a Blueprint becomes the source of truth for the
# services it defines. Verify the service `name`, build command, publish path, and
# the env vars below match the live dashboard config before syncing, and validate on
# a preview deploy first — a mismatch can break the production frontend deploy. Env
# var VALUES are NOT stored here (`sync: false`); they stay dashboard-managed.

services:
  - type: web
    name: Static Site            # <-- MUST match the existing Render static site's name, or a duplicate is created
    runtime: static
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: false
    envVars:
      # Values stay in the Render dashboard (sync: false = "managed elsewhere, don't overwrite").
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      # ── Prerendered ad landing pages — MUST stay above the SPA catch-all ──
      #
      # [AIQ-1783 / ADS-3] `npm run build` prerenders these to
      # dist/<route>/index.html. Render resolves that file as a directory index only
      # when the request carries a trailing slash. `/mobility-teams` (no slash) matches
      # no file, falls through to the `/*` rewrite below, and returns index.html — whose
      # <div id="root"> is empty until JS runs.
      #
      # Measured on prod 2026-08-10: `/mobility-teams` = 1,677 bytes (shell),
      # `/mobility-teams/` = 12,049 bytes (prerendered). Identical for OAI-AdsBot and
      # facebookexternalhit. Every ad crawler would have validated a blank page.
      #
      # Routes are first-match-wins, so these two must precede `/*`. The ad URLs in
      # docs/gtm/ADS-4_destination_urls.md carry the slash and do not depend on these
      # rules — these exist so the bare URL a human types or links to also works.
      # Gate: `bash scripts/check_ad_landing_prerender.sh`.
      - type: rewrite
        source: /mobility-teams
        destination: /mobility-teams/index.html
      - type: rewrite
        source: /relocation-checklist
        destination: /relocation-checklist/index.html
      # SPA fallback — every other path renders client-side.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://eu-assets.i.posthog.com; worker-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.relopass.com https://eu.i.posthog.com https://eu-assets.i.posthog.com https://nominatim.openstreetmap.org; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
