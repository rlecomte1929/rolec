# Corridor registry profile — United States → Ecuador.
#
# Abraham Romo's corridor (Seattle → Quito). Ecuador is a brand-new destination.
# This profile ships together with the EC→ECUADOR entry in
# backend/app/services/requirements_country_key.py: test_every_corridor_destination_resolves
# fails the moment a corridor.yaml declares a destination_iso the catalog map cannot
# resolve — which is exactly the guard that stops US→EC requirement records from
# landing unservable (as IE→ES and IE did before it).
#
# The eligibility pathway step-graph (the temporary-residence / professional-visa
# route) is authored at pathways/PROFESSIONAL_RESIDENCE_2026/v1.yaml — REPRESENTATIVE,
# sourced from the corridor's own reviewed/representative requirement_items (professional
# & work-dependency residence visas, e-VISAS, cédula/orden de cedulación, RUC/SRI, SUT,
# IESS, apostille, tourist-work bar) plus the delivered us-departure candidate facts.
# facts.yaml (fact→step binding) is authored AFTER the facts load, when the refs resolve.
#
# STATUS: authoring. Nothing here is counsel-verified; nothing may render as legal
# advice in ReloPass's own voice. Ecuador (Cancillería / Ministerio del Trabajo / SRI)
# is the binding jurisdiction.

corridor:
  id: "US_EC"
  origin_iso: "US"
  destination_iso: "EC"
  display_name: "United States → Ecuador"
  aliases: ["US→EC", "US-EC"]

  # Not counsel-verified. Drives the "informational, not verified counsel" banner.
  status: authoring

  retrieval:
    trust_tiers: [1, 2, 3]
    min_similarity: 0.25

  prompt:
    task_key: "immigration_answer"

  sla:
    # DERIVED from the PROFESSIONAL_RESIDENCE_2026 step graph's pre-arrival runway
    # (longest path to the TRAVEL_TO_EC arrival anchor):
    #   VISA_APPLICATION 21 + VISA_GRANTED 14 + TRAVEL_TO_EC 1 = 36.
    # Durations are estimates pending agent confirmation; re-derive rather than hand-edit.
    at_risk_window_days: 36
    at_risk_pct: 80

  # Eligibility Corridor Agent pathways (REPRESENTATIVE content).
  pathways:
    - id: "PROFESSIONAL_RESIDENCE_2026"
      file: "pathways/PROFESSIONAL_RESIDENCE_2026/v1.yaml"
