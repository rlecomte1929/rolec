# Corridor Agent — FR_ES_2026  (France → Spain, free movement)
#
# REPRESENTATIVE — indicative content, NOT SME-verified. Grounded in the
# EU free movement (TFEU Art. 45; Directive 2004/38/EC; RD 240/2007) framework. An EU/EEA/EFTA national needs NO visa and NO salary floor;
# the journey is the administrative registration sequence. Confirm details with
# the destination authority before any authoritative use.

corridor_agent:
  corridor_id: FR_ES_2026
  version: "2026.01"
  petitioning_party: EMPLOYEE
  origin_country_iso3: FRA
  destination_country_iso3: ESP
  description: >
    France (EU/EEA/EFTA) national → Spain under free movement.
    No visa or residence-permit gate; the pathway models the administrative
    registration sequence.

  applicable_rules:
    - legal_reference: "TFEU Art. 45"
      rule_id: EU_TFEU_45
      summary: "Free movement of workers within the Union."
    - legal_reference: "Directive 2004/38/EC"
      rule_id: EU_2004_38
      summary: "Union citizens' right to move and reside freely."
    - legal_reference: "Real Decreto 240/2007"
      rule_id: ES_RD_240_2007
      summary: "Entry/residence of EU/EEA citizens — certificado de registro de ciudadano de la UE."
    - legal_reference: "Ley 7/1985 (empadronamiento)"
      rule_id: ES_PADRON
      summary: "Municipal registration (empadronamiento) of residents."

  required_documents:
    - PASSPORT_OR_NATIONAL_ID:employee
    - PASSPORT_OR_NATIONAL_ID:family.spouse?
    - EMPLOYMENT_CONTRACT?

  required_data_points:
    - key: eu_eea_nationality
      type: bool
      source: USER_INPUT
      validations:
        - "== true"

  # No salary floor applies to free movement.
  salary_thresholds_eur: {}

  eligibility_logic:
    branches:
      - id: BRANCH_FREE_MOVEMENT
        label: "EU freedom of movement (TFEU Art. 45)"
        cite: EU_TFEU_45
        requires_all:
          - eu_eea_nationality == true
        verdict_on_pass: ELIGIBLE
    no_branch_verdict: NOT_ELIGIBLE

  exception_cases: []

  step_graph:
    - step_id: TRAVEL_TO_ES
      name: "Travel to Spain (no visa for EU nationals)"
      responsible_party: EMPLOYEE
      expected_duration_days: 1
      prerequisite_step_ids: []

    - step_id: EMPADRONAMIENTO
      name: "Municipal registration (empadronamiento / padrón)"
      responsible_party: EMPLOYEE
      expected_duration_days: 7
      prerequisite_step_ids: [TRAVEL_TO_ES]
      cite: ES_PADRON

    - step_id: NIE_CERTIFICADO_REGISTRO
      name: "NIE + certificado de registro UE at the Oficina de Extranjería"
      responsible_party: EMPLOYEE
      expected_duration_days: 21
      prerequisite_step_ids: [TRAVEL_TO_ES]
      cite: ES_RD_240_2007

    - step_id: SOCIAL_SECURITY
      name: "Social-security number (número de afiliación) registered"
      responsible_party: EMPLOYEE
      expected_duration_days: 7
      prerequisite_step_ids: [NIE_CERTIFICADO_REGISTRO]

    - step_id: BANK_ACCOUNT
      name: "Spanish bank account opened (NIE required)"
      responsible_party: EMPLOYEE
      expected_duration_days: 7
      prerequisite_step_ids: [NIE_CERTIFICADO_REGISTRO]
