  # no `source:` block and the gate refuses to let it grow one.
  - fact_key: payslip_catch22
    topic: housing-payslip
    kind: preparation_item
    status: staged
    pillar: HOUSING
    title: "Landlords ask for Irish payslips that a new arrival cannot yet have"
    fact_text: >-
      Irish letting agents commonly ask for recent Irish payslips and an Irish bank account,
      both of which follow from starting work — which in turn needs an address. The loop is
      real and widely reported, but it is market practice, not a published rule.
    timing: "while searching for housing"
    non_obvious: true
    depends_on: []
    pack_keys:
      - "ES-IE:housing-payslip-catch22"
