facts:
  - fact_key: statutory_residence_test
    topic: tax-residence
    kind: obligation
    status: representative
    pillar: EMPLOYMENT
    title: "UK residence for tax is decided year by year by the Statutory Residence Test"
    fact_text: >-
      UK tax residence is determined separately for each tax year by the Statutory Residence Test,
      which weighs time spent and worked in the UK against the connections held there. A person is
      resident for a whole tax year, but that year may be split into a UK part and an overseas
      part.
    timing: "in the tax year of departure"
    non_obvious: true
    source:
      url: "https://www.gov.uk/government/publications/rdr3-statutory-residence-test-srt/guidance-note-for-statutory-residence-test-srt-rdr3"
      publisher_domain: "gov.uk"
      published_date: 2026-06-11
      retrieved_at: 2026-08-19
      evidence_quote: >-
        The test allows you to work out your residence status for a tax year. Each tax year is
        looked at separately, so you may be resident in the UK in one year but not the next, or
        vice versa. The SRT takes into account: the amount of time you spend and, where relevant,
        work in the UK; the connections you have with the UK. You’ll be resident in the UK for the
        whole of a tax year, but that year may be split into a UK and an overseas part.
      quote_sha256: "c0ea590f8998a24b747fa56474e9bda6a5d8254c50530f6f2b77e9e4e14b8a3f"
    last_verified_date: 2026-08-19
    depends_on: []
    pack_keys:
      - "GB-NO:tax-uk-statutory-residence-test-exit:uk_statutory_residence_test_exit"

