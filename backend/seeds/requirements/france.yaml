# AIQ-1349 — DRAFT requirement seed for France. verification_status: draft.
#
# Taxonomy-authored draft (the immigration corpus has US→FR chunks that should be
# used to expert-verify / ground these before promotion; run draft_requirements.py
# against prod to corpus-ground, then a human confirms each against the authority).
# REVIEW REQUIRED before loading: confirm each item with the named authority and
# promote verification_status to representative/expert_verified.
#
# Load (after review):
#   python backend/scripts/seed_requirements.py --file backend/seeds/requirements/france.yaml
# NOTE: going live also needs FR→FRANCE in requirements_builder._ISO_TO_CATALOG_NAME.

verification_status: draft
purposes_by_country:
  FRANCE: [employment, other]

requirements:
  # ── Universal (apply to all assignment lengths, incl. STA) ──
  - key: valid_passport
    pillar: IDENTITY
    severity: BLOCKER
    owner: EMPLOYEE
    applies_to_assignment_types: null
    confidence: high
    requires_expert_review: false
    countries:
      FRANCE:
        title: "Valid passport (6+ months)"
        description: "A passport valid for at least 6 months beyond the intended stay. Indicative — confirm with the French consulate."
  - key: employment_contract
    pillar: EMPLOYMENT
    severity: WARN
    owner: EMPLOYEE
    applies_to_assignment_types: null
    confidence: medium
    requires_expert_review: true
    countries:
      FRANCE:
        title: "Employment contract (contrat de travail)"
        description: "A signed French employment contract or assignment letter, often required for the work-authorization / visa file. Indicative — confirm with your employer / DREETS."
  - key: minimum_lead_time
    pillar: TIMELINE
    severity: WARN
    owner: HR
    applies_to_assignment_types: null
    confidence: medium
    requires_expert_review: true
    countries:
      FRANCE:
        title: "Minimum lead time"
        description: "Allow sufficient lead time for the work-authorization and long-stay visa process before the start date. Indicative — confirm with the French consulate / OFII."
  # ── Long-term-only (LTA / PERMANENT — dropped for STA) ──
  - key: residence_permit_validation
    pillar: RESIDENCE
    severity: WARN
    owner: EMPLOYEE
    applies_to_assignment_types: [LTA, PERMANENT]
    confidence: medium
    requires_expert_review: true
    countries:
      FRANCE:
        title: "Residence permit validation (VLS-TS / titre de séjour)"
        description: "Validate the long-stay visa (VLS-TS) with the OFII on arrival, or obtain the residence permit (titre de séjour). Indicative — confirm with OFII / the préfecture."
  - key: long_term_rental_contract
    pillar: HOUSING
    severity: WARN
    owner: EMPLOYEE
    applies_to_assignment_types: [LTA, PERMANENT]
    confidence: medium
    requires_expert_review: true
    countries:
      FRANCE:
        title: "Long-term rental contract (bail)"
        description: "Secure a long-term rental contract (bail); proof of accommodation supports residence and banking steps. Indicative — confirm with your housing provider."
  - key: social_security_registration
    pillar: SOCIAL_SECURITY
    severity: WARN
    owner: HR
    applies_to_assignment_types: [LTA, PERMANENT]
    confidence: medium
    requires_expert_review: true
    countries:
      FRANCE:
        title: "Social security registration (numéro de sécurité sociale)"
        description: "Register for French social security and obtain a numéro de sécurité sociale; the employer typically initiates this. Indicative — confirm with CPAM / URSSAF."
