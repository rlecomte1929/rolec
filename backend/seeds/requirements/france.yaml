# AIQ-1349 — requirement seed for France. verification_status: corpus_grounded.
#
# CORPUS-GROUNDED against the live US→FR immigration corpus (policy_assistant_chunks,
# source_type=immigration_rule), which cites tier-1 official sources
# (france-visas.gouv.fr, service-public.fr). Each requirement carries its source in
# `citations`. This raises provenance from representative → corpus_grounded; it is
# NOT yet human-expert-verified (a French immigration lawyer should sign off to reach
# expert_verified).
#
# SCOPE: the salaried route for NON-EEA (e.g. US) nationals — VLS-TS Salarié /
# Passeport Talent. EEA/EU nationals have free movement and need none of this.
#
# Grounding correction: most steps below apply to ANY VLS-TS stay (incl. a short
# assignment that still needs a long-stay visa), so they are universal (applies=null).
# The only clearly long-term-only step is the multi-year residence-card renewal.
#
# Reload (idempotent): python backend/scripts/seed_requirements.py --file backend/seeds/requirements/france.yaml

verification_status: corpus_grounded
source_scope: "US->FR corpus (non-EEA salaried route); EEA nationals exempt"

# Every requirement in this file is part of the non-EEA salaried route: each one
# is either the visa/permit itself or evidence submitted in support of it. The
# scope note above has said "EEA nationals exempt" since the file was written,
# but until now nothing enforced it and a French citizen relocating home was
# served the full VLS-TS track. This line is that scope, made executable.
#
# An EU/EEA national therefore matches NOTHING here — and rules_engine emits a
# stated "no visa or residence permit required" confirmation in its place, so the
# result is an explicit answer rather than an empty screen. Their substantive
# French establishment steps (CPAM, justificatif de domicile, …) come from the
# corridor pathway, not from this visa catalog.
#
# A requirement that genuinely applies to everyone overrides this with an
# explicit `applies_to_nationality_classes: null`.
default_applies_to_nationality_classes: [THIRD_COUNTRY]

purposes_by_country:
  FRANCE: [employment, other]

requirements:
  - key: passport
    pillar: IDENTITY
    severity: BLOCKER
    owner: EMPLOYEE
    applies_to_assignment_types: null
    confidence: high
    requires_expert_review: false
    citations: ["https://www.france-visas.gouv.fr/en/visa-de-long-sejour", "immigration_rule.us_fr_lsv_passport"]
    countries:
      FRANCE:
        title: "Valid passport"
        description: "A valid passport is the primary identity document for the VLS-TS Salarié / Passeport Talent application. Indicative — confirm with france-visas.gouv.fr."
  - key: long_stay_work_visa
    pillar: RESIDENCE
    severity: BLOCKER
    owner: EMPLOYEE
    applies_to_assignment_types: null
    confidence: high
    requires_expert_review: true
    citations: ["https://www.france-visas.gouv.fr/en/visa-de-long-sejour", "immigration_rule.us_fr_pathway_long_stay_visa", "immigration_rule.us_fr_overview"]
    countries:
      FRANCE:
        title: "Long-stay work visa (VLS-TS Salarié / Passeport Talent)"
        description: "Non-EEA nationals need a long-stay visa serving as a residence permit: VLS-TS Salarie (min salary ~SMIC) or Passeport Talent (Master's + salary >= EUR 43,243). Indicative — confirm with france-visas.gouv.fr."
  - key: employment_contract
    pillar: EMPLOYMENT
    severity: WARN
    owner: EMPLOYEE
    applies_to_assignment_types: null
    confidence: high
    requires_expert_review: false
    citations: ["immigration_rule.us_fr_lsv_employment_contract"]
    countries:
      FRANCE:
        title: "Signed employment contract (CDI or CDD >= 3 months)"
        description: "A signed French employment contract (CDI, or CDD of at least 3 months) supporting the long-stay visa file. Indicative — confirm with your employer / DREETS."
  - key: dgef_work_authorization
    pillar: EMPLOYMENT
    severity: WARN
    owner: HR
    applies_to_assignment_types: null
    confidence: high
    requires_expert_review: true
    citations: ["immigration_rule.us_fr_lsv_work_authorization"]
    countries:
      FRANCE:
        title: "DGEF work authorization (employer-initiated)"
        description: "For salaried VLS-TS, the employer initiates the DGEF work authorization before arrival. Indicative — confirm with DREETS / DGEF."
  - key: proof_of_accommodation
    pillar: HOUSING
    severity: WARN
    owner: EMPLOYEE
    applies_to_assignment_types: null
    confidence: high
    requires_expert_review: false
    citations: ["https://www.france-visas.gouv.fr/en/visa-de-long-sejour", "immigration_rule.us_fr_lsv_proof_of_accommodation"]
    countries:
      FRANCE:
        title: "Proof of accommodation in France"
        description: "Proof of accommodation (lease, hotel reservation >= 3 months, or attestation d'hebergement) for the long-stay visa. Indicative — confirm with france-visas.gouv.fr."
  - key: health_insurance
    pillar: HEALTHCARE
    severity: WARN
    owner: EMPLOYEE
    applies_to_assignment_types: null
    confidence: high
    requires_expert_review: false
    citations: ["immigration_rule.us_fr_lsv_health_insurance"]
    countries:
      FRANCE:
        title: "Health insurance covering the visa validity"
        description: "Health insurance covering the full visa validity period, required for the long-stay visa. Indicative — confirm with france-visas.gouv.fr."
  - key: anef_vls_ts_validation
    pillar: RESIDENCE
    severity: BLOCKER
    owner: EMPLOYEE
    applies_to_assignment_types: null
    confidence: high
    requires_expert_review: true
    citations: ["immigration_rule.us_fr_anef_validation"]
    countries:
      FRANCE:
        title: "ANEF VLS-TS validation (within 90 days of arrival)"
        description: "Validate the VLS-TS online on ANEF within 90 days of arrival; failure invalidates legal residence and triggers a fine. Indicative — confirm on the ANEF portal (administration-etrangers.interieur.gouv.fr)."
  - key: anef_address_declaration
    pillar: RESIDENCE
    severity: WARN
    owner: EMPLOYEE
    applies_to_assignment_types: null
    confidence: medium
    requires_expert_review: true
    citations: ["immigration_rule.us_fr_anef_address_declaration"]
    countries:
      FRANCE:
        title: "ANEF address declaration (within 90 days)"
        description: "Declare your French address in ANEF within 90 days of arrival (after VLS-TS validation). Indicative — confirm on the ANEF portal."
  # ── The only genuinely long-term-only step (skipped for short assignments) ──
  - key: residence_card_renewal
    pillar: RESIDENCE
    severity: WARN
    owner: EMPLOYEE
    applies_to_assignment_types: [LTA, PERMANENT]
    confidence: high
    requires_expert_review: true
    citations: ["immigration_rule.us_fr_residence_card_renewal"]
    countries:
      FRANCE:
        title: "Multi-year residence card renewal"
        description: "If staying beyond the initial 1-year VLS-TS, apply for the multi-year residence card ~2 months before expiry (~305 days after arrival). Indicative — confirm with the prefecture."
