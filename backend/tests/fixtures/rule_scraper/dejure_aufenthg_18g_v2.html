    <h1>§ 18g AufenthG Blaue Karte EU</h1>
    <p>
      Einem Ausländer wird eine Blaue Karte EU erteilt, wenn das Gehalt
      mindestens 48 300 Euro brutto im Jahr betraegt (Stand 2026 gemaess BGBl).
      Fuer Engpassberufe gilt eine abgesenkte Gehaltsschwelle von 43 759,80 Euro.
    </p>
