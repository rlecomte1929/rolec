name: Catalog HR-vendor promotion

# [CATALOG-2-FU/AIQ-1077] Calls POST /api/crons/promote-hr-vendors once a day to
# promote popular HR custom vendors into the master catalog (>= threshold distinct
# companies added the same vendor). Idempotent — the service skips vendors already
# in the master catalog. Gated behind `vars.CATALOG_PROMOTION_CRON_ENABLED` so this
# is a no-op until the secret/vars are configured.

on:
  schedule:
    # 03:30 UTC daily — staggered after the 03:00 source-monitoring scheduler.
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (detect only, no writes)"
        type: boolean
        default: false

concurrency:
  group: catalog-promotion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    name: Promote popular HR vendors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The gate deliberately sits on the STEP, not the job. With `if:` on the job the
    # whole run is skipped, and a skipped run renders as "completed" in the Actions
    # UI — indistinguishable from a successful one. Same pattern as
    # crawl-scheduler.yml; see docs/findings/AIQ-2012-cron-gates-never-set.md.
    env:
      # Quoted env (not inlined into run:) per workflow-injection guidance.
      API_BASE: ${{ vars.CATALOG_PROMOTION_API_BASE }}    # e.g. https://api.relopass.com
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - name: Report gate state
        env:
          ENABLED: ${{ vars.CATALOG_PROMOTION_CRON_ENABLED }}
        run: |
          set -euo pipefail
          if [ "${ENABLED:-}" != "true" ]; then
            {
              echo "## Catalog HR-vendor promotion: DISABLED"
              echo ''
              echo "\`vars.CATALOG_PROMOTION_CRON_ENABLED\` is \`${ENABLED:-<unset>}\` — nothing ran."
              echo "Popular HR vendors are not being promoted into the catalog."
              echo "Set the repo variable to \`true\` to enable."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Catalog HR-vendor promotion disabled::CATALOG_PROMOTION_CRON_ENABLED is '${ENABLED:-<unset>}'; nothing ran."
          fi

      - name: POST /api/crons/promote-hr-vendors
        if: ${{ vars.CATALOG_PROMOTION_CRON_ENABLED == 'true' }}
        run: |
          set -euo pipefail
          if [ -z "${API_BASE:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "API_BASE or CRON_SECRET not configured; skipping."
            exit 0
          fi
          response=$(curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${API_BASE}/api/crons/promote-hr-vendors?dry_run=${DRY_RUN}")
          echo "$response"
          # Surface the promotion summary in the workflow run summary so reviewers
          # can see promoted / skipped_existing / below_threshold without an artifact.
          {
            echo "## Catalog HR-vendor promotion run"
            echo ''
            echo '```json'
            echo "$response"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
