name: Perf budget (authed latency)

# [AIQ-1014/PERF-4] Scheduled authenticated-latency budget gate. Runs the PERF-1
# harness (scripts/perf_authed_harness.py) against prod and:
#   - surfaces the *aspirational* 2s/3s p95/max breaches as ::warning:: (for trend),
#   - hard-FAILS (notifies) only on a *regression* ceiling (p95 > 3s or max > 5s)
#     or a persona login outage — so it's green at today's warm baseline
#     (~0.6-2.8s, see docs/performance/authed_audit_2026-06.md) but catches real
#     regressions and outages.
#
# NOT run on PRs: it needs prod + costs metered Actions minutes. Scheduled a few
# times a day during business hours + manual dispatch.
#
# Credentials: the harness defaults to the shared demo accounts (already in the
# script). To override (e.g. after a demo-cred rotation), add repo secrets
# PERF_ADMIN_PW / PERF_HR_PW / PERF_EMP_PW via the GitHub web UI (gh secret set
# from a no-TTY shell silently stores EMPTY). The run step only exports them when
# non-empty, so an unset secret falls back to the harness default rather than
# clobbering it with "".

on:
  schedule:
    # 08:00, 13:00, 17:00 UTC, Mon-Fri — ~3 runs/day, low metered-minute cost.
    - cron: "0 8,13,17 * * 1-5"
  workflow_dispatch:
    inputs:
      p95_regression_ms:
        description: "Hard-fail if any warm p95 exceeds this (ms)."
        default: "3000"
        required: false
      max_regression_ms:
        description: "Hard-fail if any warm max exceeds this (ms)."
        default: "5000"
        required: false
      samples:
        description: "Warm samples per endpoint."
        default: "6"
        required: false

concurrency:
  group: perf-budget
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  budget:
    name: Authed latency budget
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run authed latency harness
        env:
          SAMPLES: ${{ github.event.inputs.samples || '6' }}
          SECRET_ADMIN_PW: ${{ secrets.PERF_ADMIN_PW }}
          SECRET_HR_PW: ${{ secrets.PERF_HR_PW }}
          SECRET_EMP_PW: ${{ secrets.PERF_EMP_PW }}
        run: |
          set -euo pipefail
          # Only export creds when the secret is actually set — otherwise leave
          # unset so the harness uses its baked-in demo defaults (never "").
          [ -n "${SECRET_ADMIN_PW:-}" ] && export PERF_ADMIN_PW="$SECRET_ADMIN_PW"
          [ -n "${SECRET_HR_PW:-}" ] && export PERF_HR_PW="$SECRET_HR_PW"
          [ -n "${SECRET_EMP_PW:-}" ] && export PERF_EMP_PW="$SECRET_EMP_PW"
          python3 scripts/perf_authed_harness.py \
            --json --samples "$SAMPLES" --delay-ms 600 \
            > perf.json
          echo "Harness run complete."

      - name: Evaluate budgets (warn aspirational, fail on regression/outage)
        env:
          REG_P95: ${{ github.event.inputs.p95_regression_ms || '3000' }}
          REG_MAX: ${{ github.event.inputs.max_regression_ms || '5000' }}
          STRICT_P95: "2000"
          STRICT_MAX: "3000"
        run: |
          python3 - <<'PY'
          import json, os, sys

          reg_p95 = float(os.environ["REG_P95"])
          reg_max = float(os.environ["REG_MAX"])
          strict_p95 = float(os.environ["STRICT_P95"])
          strict_max = float(os.environ["STRICT_MAX"])

          with open("perf.json") as f:
              data = json.load(f)

          warnings, failures = [], []
          for persona, block in data.get("personas", {}).items():
              if not block.get("logged_in"):
                  failures.append(f"{persona}: login FAILED ({block.get('identifier')}) — outage or cred drift")
                  continue
              for ep in block.get("endpoints", []):
                  warm = ep.get("warm")
                  name = f"{persona} {ep['endpoint']}"
                  if not warm:
                      # No warm 2xx samples: surface, but don't fail (could be a
                      # tight rate limit on that route, not a latency regression).
                      warnings.append(f"{name}: no warm 2xx samples (statuses={ep.get('statuses')}, rl={ep.get('rate_limited')})")
                      continue
                  p95, mx = warm["p95_ms"], warm["max_ms"]
                  if p95 > strict_p95 or mx > strict_max:
                      warnings.append(f"{name}: p95={p95}ms max={mx}ms over aspirational {strict_p95:.0f}/{strict_max:.0f}")
                  if p95 > reg_p95:
                      failures.append(f"{name}: p95 {p95}ms > regression ceiling {reg_p95:.0f}ms")
                  if mx > reg_max:
                      failures.append(f"{name}: max {mx}ms > regression ceiling {reg_max:.0f}ms")

          for w in warnings:
              print(f"::warning::{w}")
          for fdesc in failures:
              print(f"::error::{fdesc}")

          print(f"\nSummary: {len(warnings)} aspirational warning(s), {len(failures)} regression/outage failure(s).")
          print(f"Aspirational budget p95<={strict_p95:.0f} max<={strict_max:.0f}; regression ceiling p95<={reg_p95:.0f} max<={reg_max:.0f}.")
          sys.exit(1 if failures else 0)
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-budget-${{ github.run_id }}
          path: perf.json
          retention-days: 30
