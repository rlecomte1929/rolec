name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight runs when new commits land on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    # Catches workflow YAML errors (bad `uses:` refs, secrets.* in job-level
    # `if:`, broken matrix syntax, etc.) on PRs — before they reach main and
    # cause the 0-second "workflow file issue" parse failure that blocks every
    # subsequent push. Background: PR #134.
    name: Actionlint (workflow YAML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: raven-actions/actionlint@v2
        with:
          files: ".github/workflows/*.yml"

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Confirm dist/ was produced
        run: |
          if [ ! -d dist ] || [ -z "$(ls -A dist)" ]; then
            echo "::error::frontend/dist was not produced by the build"
            exit 1
          fi

  hr-dashboard-build:
    # C1-11a: separate Vite app at apps/hr-dashboard/. Mirrors the
    # frontend-build job's shape (npm ci → build → typecheck → lint) so a
    # regression in either app surfaces in the same CI lane.
    name: HR Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/hr-dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/hr-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Confirm dist/ was produced
        run: |
          if [ ! -d dist ] || [ -z "$(ls -A dist)" ]; then
            echo "::error::apps/hr-dashboard/dist was not produced by the build"
            exit 1
          fi

  backend-tests:
    name: Backend tests (deterministic P1 suite)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci_test.db
      RELOPASS_DISABLE_RATE_LIMITS: "1"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Pytest (P1 deterministic suite)
        run: |
          python -m pytest -q \
            backend/tests/test_admin_form_templates_router.py \
            backend/tests/test_trigger_engine.py \
            backend/tests/test_case_dossier_forms.py

  route-auth-check:
    # AUDIT-B6: enumerate every GET route in the FastAPI apps (via AST, no DB
    # required) and assert each one uses an auth Depends() or is explicitly
    # allowlisted in scripts/route_auth_allowlist.txt (with a comment).
    # Exit 1 if any unguarded GET route is found outside the allowlist.
    name: Route-auth audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run route-auth check
        run: python scripts/check_route_auth.py --root .

  rls-coverage:
    # AUDIT-A3: lists `public.*` tables with zero RLS policies and asserts each
    # one is on the supabase/rls_allowlist.txt allowlist. Drains over time.
    # Requires DATABASE_URL secret pointing at the live/staging Supabase (read-only).
    name: RLS coverage check
    runs-on: ubuntu-latest
    # GitHub Actions does not allow `secrets.*` in a job-level `if:` — referencing
    # one here makes the whole workflow fail at parse time with the unhelpful
    # "workflow file issue" error (0s run, no log). Gate on a repo variable instead:
    # set `vars.RLS_COVERAGE_DATABASE_URL_SET=true` when the secret is configured.
    if: ${{ vars.RLS_COVERAGE_DATABASE_URL_SET == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install psycopg2
        run: pip install psycopg2-binary==2.9.9
      - name: Run RLS coverage audit
        env:
          DATABASE_URL: ${{ secrets.RLS_COVERAGE_DATABASE_URL }}
        run: python scripts/check_rls_coverage.py
